[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajrl-validator"
version = "0.1.0"
description = "TrajRL SN11 follower validator: verifies the centrally settled allocation statement, re-derives it, checks the rails, sets weights."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "bittensor-wallet>=4.1,<5",
    "py-sr25519-bindings>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
chain = ["bittensor>=10.5,<11"]

[project.scripts]
trajrl-validator = "trajrl_validator.validator:main"
trajrl-health = "trajrl_validator.validator:healthcheck"

[tool.hatch.build.targets.wheel]
packages = ["trajrl_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
